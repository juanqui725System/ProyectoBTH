<form id="formUsuario" class="space-y-4">
  <div>
    <label for="username" class="mb-1 block text-sm font-semibold text-gray-700">Username</label>
    <input id="username" name="username" type="text" required
      class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
  </div>
  <div>
    <label for="password" class="mb-1 block text-sm font-semibold text-gray-700">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="true" required
      class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
  </div>
  <div>
    <label for="codEmpleado" class="mb-1 block text-sm font-semibold text-gray-700">Código Empleado</label>
    <input id="codEmpleado" name="cod_empleado" type="number" required
      class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
  </div>
  <div>
    <label for="estado" class="mb-1 block text-sm font-semibold text-gray-700">Estado</label>
    <select id="estado" name="estado"
      class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
      <option value="1">Activo</option>
      <option value="0">Inactivo</option>
    </select>
  </div>
</form>

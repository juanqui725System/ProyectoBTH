<div class="rounded-lg bg-white p-6 shadow-md">
  <div class="mb-4 flex items-center justify-between">
    <h2 class="text-2xl font-bold">Listado de Usuarios</h2>
    <button id="btnNuevoUsuario"
      class="flex items-center gap-2 rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-500">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      Nuevo Usuario
    </button>
  </div>
  <div class="overflow-x-auto">
    <table class="w-full text-left text-sm">
      <thead>
        <tr class="border-b-2 border-gray-200 bg-gray-100 text-gray-600 uppercase">
          <th class="px-4 py-3 font-semibold">ID</th>
          <th class="px-4 py-3 font-semibold">Username</th>
          <th class="px-4 py-3 font-semibold">Estado</th>
          <th class="px-4 py-3 font-semibold">Código Empleado</th>
          <th class="px-4 py-3 text-center font-semibold">Acciones</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <tr>
          <td colspan="5" class="px-4 py-4 text-center text-gray-500">Cargando...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div id="modalUsuario" class="fixed inset-0 z-50 hidden items-center justify-center bg-gray-900/50 p-4">
  <div class="w-full max-w-md rounded-lg bg-white p-6 shadow-xl">
    <div class="mb-4 flex items-center justify-between">
      <h3 class="text-xl font-bold text-gray-800">Nuevo Usuario</h3>
      <button id="btnCerrarModal"
        class="flex h-8 w-8 items-center justify-center rounded-full text-gray-500 transition hover:bg-gray-200 hover:text-gray-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <form id="formUsuario" class="space-y-4">
      <div>
        <label for="username" class="mb-1 block text-sm font-semibold text-gray-700">Username</label>
        <input id="username" name="username" type="text" required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
      </div>
      <div>
        <label for="password" class="mb-1 block text-sm font-semibold text-gray-700">Contraseña</label>
        <input id="password" name="password" type="password" required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
      </div>
      <div>
        <label for="codEmpleado" class="mb-1 block text-sm font-semibold text-gray-700">Código Empleado</label>
        <input id="codEmpleado" name="cod_empleado" type="number" required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
      </div>
      <div>
        <label for="estado" class="mb-1 block text-sm font-semibold text-gray-700">Estado</label>
        <select id="estado" name="estado"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
          <option value="1">Activo</option>
          <option value="0">Inactivo</option>
        </select>
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" id="btnCancelar"
          class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 transition hover:bg-gray-100">Cancelar</button>
        <button type="submit"
          class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-500">Guardar</button>
      </div>
    </form>
  </div>
</div>
